name: Publish verified Windows release

# Publication is explicit: an existing tag alone never creates a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching VERSION (for example v2.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify requested version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -ne ('v' + $version)) {
            throw 'Tag must be v followed by the exact VERSION value.'
          }
      - run: python tests/check_public.py
      - run: python scripts/build.py
      - run: python tests/check_public.py --dist dist
      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/check_powershell.ps1
      - run: python tests/smoke.py --report dist/TEST-RESULTS.json
      - name: Create release without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "Disk Rescue $env:RELEASE_TAG" --generate-notes dist/Recover-Disk.ps1 dist/DiskRescue-win-x64.zip dist/SHA256SUMS.json dist/SHA256SUMS.txt dist/BUILD-INFO.json
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
